function addOrUpdateSidebarItem(id, title) {
  const list = document.getElementById('sessionsList');
  const s = { id, title, createdAt: new Date().toISOString() };
  const item = renderSessionItem(s, list);
  if (!list.contains(item)) list.prepend(item);
  document.querySelectorAll('.session-item').forEach(e => e.classList.remove('active'));
  item.classList.add('active');
}

function renderSessionItem(s, list) {
  const existing = list.querySelector(`.session-item[data-id="${s.id}"]`);
  if (existing) {
    existing.querySelector('.s-title').textContent = s.title || '';
    existing.querySelector('.s-meta').textContent = fmtTime(s.createdAt);
    return existing;
  }
  const item = document.createElement('div');
  item.className = 'session-item';
  item.dataset.id = s.id;
  item.innerHTML = `
    <div class="session-item-info">
      <div class="s-title">${esc(s.title||'')}</div>
      <div class="s-meta">${fmtTime(s.createdAt)}</div>
    </div>
    <button class="del-btn" data-id="${s.id}" title="删除">✕</button>`;
  item.addEventListener('click', e => {
    if (e.target.closest('.del-btn')) return;
    loadSession(s.id, item);
  });
  item.querySelector('.del-btn').addEventListener('click', async e => {
    e.stopPropagation();
    await fetch(`/sessions/${s.id}`, { method: 'DELETE' });
    sessionCache.delete(s.id);
    if (currentSessionId === s.id) {
      currentSessionId = null;
      if (es) { es.close(); es = null; }
      localStorage.removeItem('last-session');
      history.replaceState(null, '', location.pathname);
      chat.innerHTML = '';
      const h = el('div','sys-msg'); h.id='emptyHint';
      h.textContent = '输入任务，Team 会自动选择协作模式并完成';
      chat.appendChild(h); resetBoard(); setTitle('新任务');
    }
    item.remove();
  });
  return item;
}

async function loadSessions(autoLoadLast = false) {
  try {
    const sessions = await fetch('/sessions').then(r=>r.json());
    const list = document.getElementById('sessionsList');

    // 移除已删除的 session item
    list.querySelectorAll('.session-item').forEach(el2 => {
      if (!sessions.find(s => s.id === el2.dataset.id)) el2.remove();
    });

    // 插入或更新 session items（最新的在最前）
    sessions.forEach((s, i) => {
      const item = renderSessionItem(s, list);
      if (!list.contains(item)) {
        if (i === 0) list.prepend(item);
        else {
          const prev = list.querySelector(`.session-item[data-id="${sessions[i-1].id}"]`);
          prev ? prev.after(item) : list.appendChild(item);
        }
      }
    });

    // 高亮当前 session
    list.querySelectorAll('.session-item').forEach(el2 => {
      el2.classList.toggle('active', el2.dataset.id === currentSessionId);
    });

    // 刷新后自动恢复上次打开的 session
    if (autoLoadLast && sessions.length) {
      const lastId = localStorage.getItem('last-session');
      const target = sessions.find(s => s.id === lastId) || sessions[0];
      const el2 = list.querySelector(`.session-item[data-id="${target.id}"]`);
      loadSession(target.id, el2);
    }
  } catch {}
}

let pollTimer = null;
let loadSessionToken = 0; // 每次 loadSession 递增，sendTask 时让旧的 loadSession 作废

async function loadSession(id, elItem) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  const myToken = ++loadSessionToken;

  history.replaceState(null, '', `?session=${id}`);
  localStorage.setItem('last-session', id);
  document.querySelectorAll('.session-item').forEach(e => e.classList.remove('active'));
  elItem?.classList.add('active');

  try {
    console.log('fetching session:', id);
    const s = await fetch(`/sessions/${id}`).then(r=>r.json());
    // 如果 sendTask 已经发出（token 已变），放弃渲染
    if (myToken !== loadSessionToken) return;
    console.log('session loaded:', s.title, 'messages:', s.messages?.length);
    currentSessionId = id;
    chat.innerHTML = '';
    resetBoard();
    setTitle(s.title||'');

    // 恢复 agentState（Dispatcher/Merger/Worker 卡片状态）
    // 从 messages 统一抽象读当前 round 的 dispatch，兼容旧数据回退到 session.dispatch
    const msgs = s.messages || [];
    // 只取当前轮次的 dispatch，不跨轮 fallback（避免 NOOP 轮次显示上一轮的模式/拓扑）
    const currentDispatch = (msgs.findLast ? msgs.findLast(m => m.role === 'dispatch' && m.roundId === s.currentRoundId) : null)
      || (s.dispatch?.roundId === s.currentRoundId ? s.dispatch : null);
    if (s.agentState && s.agentState.roundId === s.currentRoundId) {
      window._agentState = s.agentState;
      window._currentMode = currentDispatch?.mode || null;
      const { dispatcherStatus, workers } = s.agentState;
      const isNoop = currentDispatch?.mode === 'NOOP';
      if (dispatcherStatus) {
        const dispLabel = dispatcherStatus === 'done'
          ? `→ ${currentDispatch?.mode || ''}`
          : dispatcherStatus === 'aborted' ? '→ 已中止'
          : dispatcherStatus === 'paused'  ? '→ 已暂停'
          : '分析任务类型和协作模式...';
        const dispWStatus = (dispatcherStatus === 'aborted' || dispatcherStatus === 'paused') ? 'done' : dispatcherStatus;
        upsertWorker('dispatcher', 'dispatcher', dispWStatus, dispLabel);
        // 历史恢复：暂停态重建补充输入区
        if (dispatcherStatus === 'paused') {
          showPausedUI();
          showResumeBtn();
        }
      }
      const workerEntries = workers && Object.keys(workers).length
        ? Object.entries(workers)
        : [];
      if (!isNoop && workerEntries.length) {
        // 历史恢复：更新 Team Members 卡片状态
        workerEntries.forEach(([wid, w]) => upsertMember(wid, 'worker', w.status, w.task));
        // 恢复拓扑和看板内容
        const boardTasks = s.taskSnapshot?.length ? s.taskSnapshot : (currentDispatch?.tasks || []);
        if (boardTasks.length) {
          document.getElementById('topoSection').classList.add('open');
          requestAnimationFrame(() => updateTopo(boardTasks));
          updateQueueBoard(boardTasks);
        }
      }
    }
    // agentState 已恢复后再更新 UI（分享按钮依赖 _agentState.dispatcherStatus）
    // 兜底：旧 session 无 agentState 时，有 result 消息也视为已完成
    if (!window._agentState && msgs.some(m => m.role === 'result')) {
      window._agentState = { dispatcherStatus: 'done' };
    }
    if (s.isRunning) setRunning(true, id);
    updateRunningUI();
    renderSessionMessages(s);

    // 渲染完成后再连 SSE，避免 task_emerged 等事件在 dispatch 卡片渲染前到达
    connectSSE(id);


    // 如果没有完整结果，判断是否是孤儿任务（没有 worker 在跑）
    const hasAllResults = (s.messages||[]).filter(m=>m.role==='user')
      .every(m => (s.messages||[]).some(r => r.role==='result' && r.roundId===m.roundId));
    if (!hasAllResults && s.title) {
      // 检查是否是孤儿任务（有未完成任务但不在 runningSessions 里）
      const hasPendingTasks = s.taskSnapshot?.some(t => t.status === 'pending' || t.status === 'claimed');
      const isPaused = s.agentState?.dispatcherStatus === 'paused';
      const isOrphan = hasPendingTasks && !runningSessions.has(id) && !isPaused;
      if (isOrphan) {
        showResumeBtn();
      }
      pollTimer = setInterval(async () => {
        const fresh = await fetch(`/sessions/${id}`).then(r=>r.json()).catch(()=>null);
        if (!fresh) return;
        const freshComplete = (fresh.messages||[]).filter(m=>m.role==='user')
          .every(m => (fresh.messages||[]).some(r => r.role==='result' && r.roundId===m.roundId));
        if (freshComplete && fresh.messages?.length) {
          clearInterval(pollTimer); pollTimer = null;
          hideResumeBtn();
          currentSessionId = null; // 强制重新加载
          loadSession(id, elItem);
        }
      }, 3000);
    }
  } catch(e) { console.error('loadSession error:', e); sysMsg('加载失败: ' + e.message, true); }
}

function fmtTime(iso) { const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }

// ── Markdown ──────────────────────────────────────────────────────
function renderMd(md) {
  let h=esc(md);
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${c.trimEnd()}</code></pre>`);
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  h=h.replace(/^---$/gm,'<hr>');
  h=h.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/^[\-\*] (.+)$/gm,'<li>$1</li>');
  h=h.replace(/(<li>[\s\S]+?<\/li>\n?)+/g,m=>`<ul>${m}</ul>`);
  h=h.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  h=h.replace(/\|(.+)\|\n\|[-| :]+\|\n((?:\|.+\|\n?)+)/g,(_,hdr,rows)=>{
    const ths=hdr.split('|').filter(Boolean).map(c=>`<th>${c.trim()}</th>`).join('');
    const trs=rows.trim().split('\n').map(r=>`<tr>${r.split('|').filter(Boolean).map(c=>`<td>${c.trim()}</td>`).join('')}</tr>`).join('');
    return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
  });
  h=h.replace(/\n\n+/g,'</p><p>'); h='<p>'+h+'</p>';
  h=h.replace(/<p>(<h[1-3]>|<ul>|<pre>|<hr>|<table>|<blockquote>)/g,'$1');
  h=h.replace(/(<\/h[1-3]>|<\/ul>|<\/pre>|<hr>|<\/table>|<\/blockquote>)<\/p>/g,'$1');
  h=h.replace(/<p><\/p>/g,'');
  return h;
}

// ── Utils ─────────────────────────────────────────────────────────
function el(tag,cls){const e=document.createElement(tag);e.className=cls;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── Init ─────────────────────────────────────────────────────────
(function init() {
  // 恢复主题
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme) {
    document.documentElement.dataset.theme = savedTheme;
    document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
  }

  // 恢复侧边栏状态
  if (localStorage.getItem('sidebar-collapsed') === '1') {
    document.getElementById('sidebar').classList.add('collapsed');
    document.getElementById('sidebarToggle').textContent = '▶';
  }

  // 初始化：渲染常驻的 Dispatcher 卡片
  upsertWorker('dispatcher', 'dispatcher', 'idle', '待命');

  // 初始化：从配置拉取 maxWorkers，渲染固定数量的 Team Members 卡片
  fetch('/config/agent').then(r => r.json()).then(cfg => {
    const count = cfg.maxWorkers || 4;
    document.getElementById('memberCount').textContent = count;
    for (let i = 1; i <= count; i++) {
      upsertMember(`worker-${i}`, 'worker', 'idle', '待命');
    }
  }).catch(() => {});

  // URL 参数优先：?session=xxx 直接加载指定 session
  const urlSessionId = new URLSearchParams(location.search).get('session');
  if (urlSessionId) {
    connectSSE(urlSessionId); // 先连 SSE，不预设 currentSessionId
    loadSessions(false).then(() => {
      const el2 = document.querySelector(`.session-item[data-id="${urlSessionId}"]`);
      loadSession(urlSessionId, el2);
    });
  } else {
    loadSessions(true);
  }
  inputTa.focus();

  // ── Settings Modal 绑定 ────────────────────────────────────────────
  initSettingsModal();
})();

// ── Settings Modal ────────────────────────────────────────────────
function openSettings() {
  document.getElementById('settingsOverlay').classList.add('open');
  // 并行拉取：当前配置 + 安装状态检测
  Promise.all([
    fetch('/config/agent').then(r => r.json()).catch(() => ({ agent: 'claude' })),
    fetch('/config/agent/check').then(r => r.json()).catch(() => ({})),
  ]).then(([cfg, checks]) => {
    setSelectedAgent(cfg.agent || 'claude');
    applyInstallChecks(checks);
  });
}
function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('open');
}

function setSelectedAgent(name) {
  document.querySelectorAll('.agent-opt').forEach(opt => {
    opt.classList.toggle('selected', opt.dataset.agent === name);
  });
  const badge = document.getElementById('currentAgentBadge');
  if (badge) badge.textContent = name;
}

function applyInstallChecks(checks) {
  document.querySelectorAll('.agent-opt').forEach(opt => {
    const agent = opt.dataset.agent;
    const info = checks[agent];
    const nameEl = opt.querySelector('.agent-opt-name');
    // 清除旧 tag
    nameEl?.querySelectorAll('.agent-opt-not-installed-tag').forEach(t => t.remove());
    if (info && !info.installed) {
      opt.classList.add('not-installed');
      const tag = document.createElement('span');
      tag.className = 'agent-opt-not-installed-tag';
      tag.textContent = '未安装';
      nameEl?.appendChild(tag);
    } else {
      opt.classList.remove('not-installed');
    }
  });
}

function showSettingStatus(msg, isErr = false) {
  const el2 = document.getElementById('settingStatus');
  if (!el2) return;
  el2.textContent = msg;
  el2.className = 'setting-status show' + (isErr ? ' err' : '');
  clearTimeout(el2._timer);
  el2._timer = setTimeout(() => el2.classList.remove('show'), 2500);
}

function initSettingsModal() {
  const settingsOverlay = document.getElementById('settingsOverlay');
  document.getElementById('settingsBtn').addEventListener('click', openSettings);
  document.getElementById('settingsClose').addEventListener('click', closeSettings);
  settingsOverlay.addEventListener('click', e => { if (e.target === settingsOverlay) closeSettings(); });

  document.getElementById('agentOptions').addEventListener('click', async e => {
    const opt = e.target.closest('.agent-opt');
    if (!opt) return;
    const agent = opt.dataset.agent;
    if (!agent) return;
    // 未安装：阻止切换，显示提示
    if (opt.classList.contains('not-installed')) {
      showSettingStatus(`${agent} CLI 未安装，请先安装后再切换`, true);
      return;
    }
    // 记录切换前的选中状态，失败时回滚
    const prevAgent = document.querySelector('.agent-opt.selected')?.dataset.agent || 'claude';
    setSelectedAgent(agent);
    try {
      const r = await fetch('/config/agent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ agent }),
      });
      const data = await r.json();
      if (data.ok) {
        showSettingStatus(`✓ 已切换到 ${agent}`);
      } else if (data.notInstalled) {
        setSelectedAgent(prevAgent); // 回滚
        showSettingStatus(`${agent} CLI 未安装（${data.bin}）`, true);
      } else {
        setSelectedAgent(prevAgent);
        showSettingStatus('保存失败: ' + (data.error || ''), true);
      }
    } catch (err) {
      setSelectedAgent(prevAgent);
      showSettingStatus('保存失败: ' + err.message, true);
    }
  });
}
